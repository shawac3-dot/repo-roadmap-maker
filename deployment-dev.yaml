apiVersion: v1
kind: PersistentVolume
metadata:
  name: shawac3-pv-dev
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: 10.48.228.25
    path: /srv/nfs/shawac3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shawac3-pvc-dev
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-scheduler-dev
  labels:
    app: employee-scheduler
    environment: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-scheduler
      environment: development
  template:
    metadata:
      labels:
        app: employee-scheduler
        environment: development
    spec:
      imagePullSecrets:
        - name: roseaw-dockerhub
      containers:
      - name: employee-scheduler
        image: cithit/shawac3:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: data
          mountPath: /usr/share/nginx/html/data
        env:
        - name: NODE_ENV
          value: "development"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: shawac3-pvc-dev
---
apiVersion: v1
kind: Service
metadata:
  name: employee-scheduler-dev-service
spec:
  type: ClusterIP
  selector:
    app: employee-scheduler
    environment: development
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
