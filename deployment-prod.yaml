apiVersion: v1
kind: PersistentVolume
metadata:
  name: shawac3-pv-prod
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: 10.48.228.25
    path: /srv/nfs/shawac3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shawac3-pvc-prod
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-scheduler-prod
  labels:
    app: employee-scheduler
    environment: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: employee-scheduler
      environment: production
  template:
    metadata:
      labels:
        app: employee-scheduler
        environment: production
    spec:
      imagePullSecrets:
        - name: roseaw-dockerhub
      containers:
      - name: employee-scheduler
        image: cithit/shawac3:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: data
          mountPath: /usr/share/nginx/html/data
        env:
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: shawac3-pvc-prod
---
apiVersion: v1
kind: Service
metadata:
  name: employee-scheduler-prod-service
spec:
  type: LoadBalancer
  loadBalancerIP: 10.48.229.48
  selector:
    app: employee-scheduler
    environment: production
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
