apiVersion: v1
kind: PersistentVolume
metadata:
  name: shawac3-pv-prod
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: 10.48.228.25
    path: /srv/nfs/shawac3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shawac3-pvc-prod
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-scheduler
  labels:
    app: employee-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-scheduler
  template:
    metadata:
      labels:
        app: employee-scheduler
    spec:
      imagePullSecrets:
        - name: roseaw-dockerhub
      containers:
      - name: employee-scheduler
        image: cithit/shawac3:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: data
          mountPath: /usr/share/nginx/html/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: shawac3-pvc-prod
---
apiVersion: v1
kind: Service
metadata:
  name: employee-scheduler-prod-service
spec:
  type: LoadBalancer
  loadBalancerIP: 10.48.229.48
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  selector:
    app: employee-scheduler
